name: Build Android Native APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Full Android Project
        run: |
          mkdir -p app/src/main/java/com/example/universalcopy
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "Universal Copy"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              ext.kotlin_version = '1.9.0'
              repositories { google(); mavenCentral() }
              dependencies { classpath "com.android.tools.build:gradle:8.1.0"; classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version" }
          }
          task clean(type: Delete) { delete rootProject.buildDir }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
              namespace 'com.example.universalcopy'
              compileSdk 34
              defaultConfig { applicationId "com.example.universalcopy"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }
              buildTypes { release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.BIND_ACCESSIBILITY_SERVICE" />
              <application android:allowBackup="true" android:label="Universal Copy" android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".CopyAccessibilityService" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="true">
                      <intent-filter><action android:name="android.accessibilityservice.AccessibilityService" /></intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackSpoken"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="100" />
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="vertical" android:gravity="center" android:padding="24dp">
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:text="Pengaturan Universal Copy" android:textSize="22sp" android:textStyle="bold" android:layout_marginBottom="16dp"/>
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:text="1. Izinkan Notifikasi saat diminta.\n2. Aktifkan layanan aksesibilitas pada tombol di bawah."
                  android:textAlignment="center" android:textSize="16sp" android:layout_marginBottom="32dp"/>
              <Button android:id="@+id/btnOpenSettings" android:layout_width="match_parent" android:layout_height="56dp"
                  android:text="Buka Pengaturan Aksesibilitas" android:textAllCaps="false" android:textSize="16sp"/>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/universalcopy/MainActivity.kt
          package com.example.universalcopy
          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.POST_NOTIFICATIONS), 101)
                      }
                  }
                  findViewById<Button>(R.id.btnOpenSettings).setOnClickListener {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }
              }
          }
          EOF

          # Kode CopyAccessibilityService.kt dengan perbaikan koordinat (FLAG_LAYOUT_NO_LIMITS) dan pemanggilan variabel
          cat << 'EOF' > app/src/main/java/com/example/universalcopy/CopyAccessibilityService.kt
          package com.example.universalcopy
          import android.accessibilityservice.AccessibilityService
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Rect
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.FrameLayout
          import android.widget.Toast
          import androidx.core.app.NotificationCompat

          data class NodeData(val text: String, val rect: Rect)

          class CopyAccessibilityService : AccessibilityService() {
              private val ACTION_TRIGGER_COPY = "com.example.universalcopy.TRIGGER_COPY"
              private var overlayView: FrameLayout? = null
              private lateinit var windowManager: WindowManager

              private val copyReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      if (intent?.action == ACTION_TRIGGER_COPY) showSelectionOverlay()
                  }
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val filter = IntentFilter(ACTION_TRIGGER_COPY)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(copyReceiver, filter, RECEIVER_EXPORTED)
                  } else {
                      registerReceiver(copyReceiver, filter)
                  }
                  showPersistentNotification()
              }

              private fun showPersistentNotification() {
                  val channelId = "universal_copy_service_channel"
                  val notificationManager = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      notificationManager.createNotificationChannel(NotificationChannel(channelId, "Universal Copy Trigger", NotificationManager.IMPORTANCE_LOW))
                  }
                  val intent = Intent(ACTION_TRIGGER_COPY)
                  val pendingIntent = PendingIntent.getBroadcast(this, 0, intent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  val notification = NotificationCompat.Builder(this, channelId)
                      .setContentTitle("Universal Copy Siap")
                      .setContentText("Ketuk untuk memilih teks")
                      .setSmallIcon(android.R.drawable.ic_menu_edit)
                      .setContentIntent(pendingIntent)
                      .setOngoing(true)
                      .build()
                  notificationManager.notify(1, notification)
              }

              private fun showSelectionOverlay() {
                  val rootNode = rootInActiveWindow
                  if (rootNode == null) {
                      Toast.makeText(this, "Gagal membaca layar", Toast.LENGTH_SHORT).show()
                      return
                  }
                  
                  val textList = mutableListOf<NodeData>()
                  traverseNode(rootNode, textList)

                  if (textList.isEmpty()) {
                      Toast.makeText(this, "Tidak ada teks yang terdeteksi", Toast.LENGTH_SHORT).show()
                      return
                  }

                  removeOverlay()

                  overlayView = FrameLayout(this)
                  overlayView?.setBackgroundColor(Color.parseColor("#99000000"))

                  // Penambahan FLAG_LAYOUT_NO_LIMITS agar mengukur dari ujung layar perangkat
                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or 
                      WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or 
                      WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )

                  overlayView?.setOnClickListener { removeOverlay() }

                  val shape = GradientDrawable().apply {
                      setColor(Color.parseColor("#332196F3"))
                      setStroke(3, Color.parseColor("#2196F3"))
                      cornerRadius = 8f
                  }

                  for (nodeData in textList) {
                      val highlight = View(this)
                      highlight.background = shape
                      
                      val layoutParams = FrameLayout.LayoutParams(nodeData.rect.width(), nodeData.rect.height())
                      highlight.layoutParams = layoutParams
                      
                      // Menggunakan koordinat mutlak (x dan y)
                      highlight.x = nodeData.rect.left.toFloat()
                      highlight.y = nodeData.rect.top.toFloat()

                      highlight.setOnClickListener {
                          val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          clipboard.setPrimaryClip(ClipData.newPlainText("Copied Text", nodeData.text))
                          // Memperbaiki string interpolation
                          Toast.makeText(this, "Disalin: ${nodeData.text.take(15)}...", Toast.LENGTH_SHORT).show()
                          removeOverlay()
                      }
                      
                      overlayView?.addView(highlight)
                  }
                  
                  windowManager.addView(overlayView, params)
              }

              private fun removeOverlay() {
                  overlayView?.let {
                      windowManager.removeView(it)
                      overlayView = null
                  }
              }

              private fun traverseNode(node: AccessibilityNodeInfo?, textList: MutableList<NodeData>) {
                  if (node == null) return
                  val text = node.text?.toString() ?: node.contentDescription?.toString()
                  
                  if (!text.isNullOrBlank() && node.isVisibleToUser) {
                      val rect = Rect()
                      node.getBoundsInScreen(rect)
                      if (rect.width() > 0 && rect.height() > 0) {
                          textList.add(NodeData(text, rect))
                      }
                  }
                  for (i in 0 until node.childCount) traverseNode(node.getChild(i), textList)
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}
              override fun onDestroy() {
                  super.onDestroy()
                  unregisterReceiver(copyReceiver)
                  removeOverlay()
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalCopy-Native-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
