name: Build Android Native APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Mengarahkan chmod ke dalam folder android
      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      # Masuk ke folder android terlebih dahulu, baru jalankan build
      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug

      # Path APK disesuaikan dengan struktur folder Flutter
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalCopy-Native-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
