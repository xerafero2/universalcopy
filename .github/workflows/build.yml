name: Build Android Native APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Menginstal Gradle langsung ke server GitHub
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Menjalankan build menggunakan perintah 'gradle' (bukan ./gradlew)
      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalCopy-Native-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
