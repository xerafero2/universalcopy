name: Build Android Native APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Full Android Project
        run: |
          mkdir -p app/src/main/java/com/example/universalcopy
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "Universal Copy"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              ext.kotlin_version = '1.9.0'
              repositories { google(); mavenCentral() }
              dependencies { classpath "com.android.tools.build:gradle:8.1.0"; classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version" }
          }
          task clean(type: Delete) { delete rootProject.buildDir }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
              namespace 'com.example.universalcopy'
              compileSdk 34
              defaultConfig { applicationId "com.example.universalcopy"; minSdk 30; targetSdk 34; versionCode 1; versionName "1.0" }
              buildTypes { release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'com.google.mlkit:text-recognition:16.0.1'
          }
          EOF

          # Menambahkan izin VIBRATE untuk haptic feedback
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.BIND_ACCESSIBILITY_SERVICE" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <application android:allowBackup="true" android:label="Universal Copy" android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".CopyAccessibilityService" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="true">
                      <intent-filter><action android:name="android.accessibilityservice.AccessibilityService" /></intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackSpoken"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:canTakeScreenshot="true"
              android:notificationTimeout="100" />
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="vertical" android:gravity="center" android:padding="24dp">
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:text="Pengaturan Universal Copy OCR" android:textSize="22sp" android:textStyle="bold" android:layout_marginBottom="16dp"/>
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:text="1. Izinkan Notifikasi saat diminta.\n2. Aktifkan layanan aksesibilitas pada tombol di bawah."
                  android:textAlignment="center" android:textSize="16sp" android:layout_marginBottom="32dp"/>
              <Button android:id="@+id/btnOpenSettings" android:layout_width="match_parent" android:layout_height="56dp"
                  android:text="Buka Pengaturan Aksesibilitas" android:textAllCaps="false" android:textSize="16sp"/>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/universalcopy/MainActivity.kt
          package com.example.universalcopy
          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.POST_NOTIFICATIONS), 101)
                      }
                  }
                  findViewById<Button>(R.id.btnOpenSettings).setOnClickListener {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }
              }
          }
          EOF

          # Kode Service dengan Padding dan Haptic Feedback
          cat << 'EOF' > app/src/main/java/com/example/universalcopy/CopyAccessibilityService.kt
          package com.example.universalcopy
          import android.accessibilityservice.AccessibilityService
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.graphics.Bitmap
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Rect
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.os.VibratorManager
          import android.view.Display
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.widget.FrameLayout
          import android.widget.Toast
          import androidx.core.app.NotificationCompat
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.TextRecognition
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions

          data class NodeData(val text: String, val rect: Rect)

          class CopyAccessibilityService : AccessibilityService() {
              private val ACTION_TRIGGER_COPY = "com.example.universalcopy.TRIGGER_COPY"
              private var overlayView: FrameLayout? = null
              private lateinit var windowManager: WindowManager

              private val copyReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      if (intent?.action == ACTION_TRIGGER_COPY) {
                          triggerHapticFeedback()
                          
                          Handler(Looper.getMainLooper()).postDelayed({
                              startOcrProcess()
                          }, 600)
                      }
                  }
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val filter = IntentFilter(ACTION_TRIGGER_COPY)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(copyReceiver, filter, RECEIVER_EXPORTED)
                  } else {
                      registerReceiver(copyReceiver, filter)
                  }
                  showPersistentNotification()
              }

              private fun triggerHapticFeedback() {
                  try {
                      val vibrator = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                          val vibratorManager = getSystemService(Context.VIBRATOR_MANAGER_SERVICE) as VibratorManager
                          vibratorManager.defaultVibrator
                      } else {
                          @Suppress("DEPRECATION")
                          getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                      }

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          vibrator.vibrate(VibrationEffect.createPredefined(VibrationEffect.EFFECT_CLICK))
                      } else {
                          @Suppress("DEPRECATION")
                          vibrator.vibrate(30)
                      }
                  } catch (e: Exception) {
                      // Mengabaikan error jika perangkat tidak memiliki motor getar
                  }
              }

              private fun showPersistentNotification() {
                  val channelId = "universal_copy_service_channel"
                  val notificationManager = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      notificationManager.createNotificationChannel(NotificationChannel(channelId, "Universal Copy Trigger", NotificationManager.IMPORTANCE_LOW))
                  }
                  val intent = Intent(ACTION_TRIGGER_COPY)
                  val pendingIntent = PendingIntent.getBroadcast(this, 0, intent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  val notification = NotificationCompat.Builder(this, channelId)
                      .setContentTitle("Universal Copy Siap")
                      .setContentText("Ketuk untuk memindai layar (OCR)")
                      .setSmallIcon(android.R.drawable.ic_menu_camera)
                      .setContentIntent(pendingIntent)
                      .setOngoing(true)
                      .build()
                  notificationManager.notify(1, notification)
              }

              private fun startOcrProcess() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      takeScreenshot(Display.DEFAULT_DISPLAY, mainExecutor, object : TakeScreenshotCallback {
                          override fun onSuccess(screenshotResult: ScreenshotResult) {
                              val hwBuffer = screenshotResult.hardwareBuffer
                              val colorSpace = screenshotResult.colorSpace
                              val bitmap = Bitmap.wrapHardwareBuffer(hwBuffer, colorSpace)
                              if (bitmap != null) {
                                  val softwareBitmap = bitmap.copy(Bitmap.Config.ARGB_8888, false)
                                  hwBuffer.close()
                                  processImageWithMLKit(softwareBitmap)
                              }
                          }
                          override fun onFailure(errorCode: Int) {
                              Toast.makeText(this@CopyAccessibilityService, "Pengambilan layar gagal: $errorCode", Toast.LENGTH_SHORT).show()
                          }
                      })
                  }
              }

              private fun processImageWithMLKit(bitmap: Bitmap) {
                  val image = InputImage.fromBitmap(bitmap, 0)
                  val recognizer = TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS)
                  
                  recognizer.process(image)
                      .addOnSuccessListener { visionText ->
                          val textList = mutableListOf<NodeData>()
                          for (block in visionText.textBlocks) {
                              for (line in block.lines) {
                                  val rect = line.boundingBox
                                  val text = line.text
                                  if (rect != null && text.isNotBlank()) {
                                      textList.add(NodeData(text, rect))
                                  }
                              }
                          }
                          if (textList.isNotEmpty()) {
                              showSelectionOverlay(textList)
                              triggerHapticFeedback() // Getaran kedua menandakan overlay siap
                          }
                      }
              }

              private fun getStatusBarHeight(): Int {
                  var result = 0
                  val resourceId = resources.getIdentifier("status_bar_height", "dimen", "android")
                  if (resourceId > 0) result = resources.getDimensionPixelSize(resourceId)
                  return result
              }

              private fun dpToPx(dp: Int): Int {
                  return (dp * resources.displayMetrics.density).toInt()
              }

              private fun showSelectionOverlay(textList: List<NodeData>) {
                  removeOverlay()
                  overlayView = FrameLayout(this)
                  overlayView?.setBackgroundColor(Color.parseColor("#80000000"))

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )

                  overlayView?.setOnClickListener { removeOverlay() }

                  val shape = GradientDrawable().apply {
                      setColor(Color.parseColor("#33FFFFFF")) 
                      setStroke(3, Color.parseColor("#FFFFFF"))
                      cornerRadius = 16f
                  }

                  val statusBarOffset = getStatusBarHeight()
                  val padX = dpToPx(8) // Jarak ekstra horizontal
                  val padY = dpToPx(4) // Jarak ekstra vertikal

                  for (nodeData in textList) {
                      val highlight = View(this)
                      highlight.background = shape
                      
                      val layoutParams = FrameLayout.LayoutParams(
                          nodeData.rect.width() + (padX * 2), 
                          nodeData.rect.height() + (padY * 2)
                      )
                      layoutParams.leftMargin = nodeData.rect.left - padX
                      layoutParams.topMargin = (nodeData.rect.top - statusBarOffset) - padY
                      highlight.layoutParams = layoutParams

                      highlight.setOnClickListener {
                          val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          clipboard.setPrimaryClip(ClipData.newPlainText("Copied Text", nodeData.text))
                          Toast.makeText(this, "Disalin: ${nodeData.text.take(15)}...", Toast.LENGTH_SHORT).show()
                          removeOverlay()
                      }
                      overlayView?.addView(highlight)
                  }
                  windowManager.addView(overlayView, params)
              }

              private fun removeOverlay() {
                  overlayView?.let {
                      windowManager.removeView(it)
                      overlayView = null
                  }
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}
              override fun onDestroy() {
                  super.onDestroy()
                  unregisterReceiver(copyReceiver)
                  removeOverlay()
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalCopy-Native-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
